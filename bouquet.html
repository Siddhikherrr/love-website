<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Bouquet For You ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=DM+Sans:wght@400;500&family=Playfair+Display:ital@0;1&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">

</head>


<body class="bouquet-body">


  <main class="bouquet-page">


    <!-- Small heading -->

    <p class="bouquet-small-title">
      something pretty
    </p>


    <!-- Main heading -->

    <h1 class="bouquet-title">
      a bouquet
      <span>for you ♡</span>
    </h1>


    <!-- Bouquet -->

    <div class="big-bouquet">

      <img src="assets/bouquet.png" alt="A bouquet">

    </div>


    <!-- Message -->

    <div class="bouquet-message">

      <p>
        If I could give you flowers
        every time you made me smile,
        you'd have a whole garden by now.
      </p>

      <span>
        — with love, always ♡
      </span>

    </div>


    <!-- Continue -->

    <button class="bouquet-continue" onclick="window.location.href='index.html'">
      back to my surprises ♡
    </button>


  </main>


  <!-- Floating petals -->

  <div class="petal petal-1">♡</div>
  <div class="petal petal-2">♡</div>
  <div class="petal petal-3">♡</div>
  <div class="petal petal-4">♡</div>
  <div class="petal petal-5">♡</div>


</body>

</html>
