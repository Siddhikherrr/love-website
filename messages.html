<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Little Things ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=DM+Sans:wght@400;500&family=Playfair+Display:ital@0;1&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">

</head>


<body class="messages-body">


  <main class="messages-page">


    <p class="messages-small-title">
      little secrets
    </p>


    <h1 class="messages-title">
      little things
      <span>I want you to know ♡</span>
    </h1>


    <p class="messages-description">
      There are little pieces of my heart
      hidden around this page.
      <br>
      Find them all.
    </p>


    <div class="message-area">


      <button class="hidden-heart heart-message-1" onclick="showHiddenMessage(1)">
        ♡
      </button>


      <button class="hidden-heart heart-message-2" onclick="showHiddenMessage(2)">
        ♡
      </button>


      <button class="hidden-heart heart-message-3" onclick="showHiddenMessage(3)">
        ♡
      </button>


      <button class="hidden-heart heart-message-4" onclick="showHiddenMessage(4)">
        ♡
      </button>


      <button class="hidden-heart heart-message-5" onclick="showHiddenMessage(5)">
        ♡
      </button>


      <button class="hidden-heart heart-message-6" onclick="showHiddenMessage(6)">
        ♡
      </button>


      <button class="hidden-heart heart-message-7" onclick="showHiddenMessage(7)">
        ♡
      </button>


      <button class="hidden-heart heart-message-8" onclick="showHiddenMessage(8)">
        ♡
      </button>


    </div>


    <p class="messages-counter">
      <span id="messageCount">0</span> / 8 found ♡
    </p>


    <button class="messages-next" id="messagesNext" onclick="goToFinalQuestion()">

      there's something I want to ask you →

    </button>


  </main>


  <!-- Popup -->

  <div class="message-popup" id="messagePopup">

    <div class="message-popup-box">

      <button class="close-message" onclick="closeHiddenMessage()">
        ×
      </button>

      <div class="popup-heart">
        ♡
      </div>

      <p id="popupMessage"></p>

    </div>

  </div>


  <script src="script.js"></script>

</body>

</html>
